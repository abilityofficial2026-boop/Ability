<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <defs>

    <linearGradient id="house" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#6EA8FF"></stop>
      <stop offset="100%" stop-color="#2563FF"></stop>

    </linearGradient>

    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#FFD976"></stop>
      <stop offset="100%" stop-color="#F5B942"></stop>

    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">

      <feGaussianBlur stdDeviation="2.4" result="blur"></feGaussianBlur>

      <feMerge>

        <feMergeNode in="blur"></feMergeNode>

        <feMergeNode in="SourceGraphic"></feMergeNode>

      </feMerge>

    </filter>

  </defs>

  <!-- Glow -->

  <circle cx="32" cy="32" r="26" fill="#2563FF" opacity="0.10" filter="url(#glow)"></circle>

  <!-- House -->

  <path d="M18 31
         L32 19
         L46 31
         V46
         H18
         Z" fill="url(#house)" stroke="#8FC2FF" stroke-width="2"></path>

  <!-- Roof -->

  <path d="M15 32
         L32 16
         L49 32" fill="none" stroke="#8FC2FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Door -->

  <rect x="28" y="35" width="8" height="11" rx="2" fill="#081324"></rect>

  <!-- Leaf -->

  <path d="M32 12
         C37 8 43 10 43 16
         C43 22 36 24 32 28
         C28 24 21 22 21 16
         C21 10 27 8 32 12Z" fill="url(#leaf)"></path>

  <!-- Stem -->

  <path d="M32 28
         L32 19" stroke="#F5B942" stroke-width="2" stroke-linecap="round"></path>

</svg>