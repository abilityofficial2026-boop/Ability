<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="900"
height="900"
viewBox="0 0 900 900">

<defs>

<!-- BACKGROUND -->

<radialGradient id="bgGlow"
cx="50%"
cy="45%"
r="70%">

<stop offset="0%"
stop-color="#173B96"
stop-opacity=".45"/>

<stop offset="100%"
stop-color="#071224"
stop-opacity="1"/>

</radialGradient>

<!-- MAP -->

<linearGradient id="mapGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#285FFF"/>

<stop offset="100%"
stop-color="#163B96"/>

</linearGradient>

<!-- GOLD -->

<linearGradient id="goldGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#FFE08A"/>

<stop offset="100%"
stop-color="#D79A22"/>

</linearGradient>

<!-- BLUE -->

<linearGradient id="blueLine"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#72B5FF"/>

<stop offset="100%"
stop-color="#2563FF"/>

</linearGradient>

<!-- NODE -->

<radialGradient id="nodeGlow">

<stop offset="0%"
stop-color="#FFFFFF"/>

<stop offset=".45"
stop-color="#8DC5FF"/>

<stop offset="1"
stop-color="#2563FF"/>

</radialGradient>

<!-- FILTER -->

<filter id="softGlow"
x="-100%"
y="-100%"
width="300%"
height="300%">

<feGaussianBlur
stdDeviation="10"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<!-- SMALL GLOW -->

<filter id="tinyGlow">

<feGaussianBlur
stdDeviation="3"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<!-- BACKGROUND -->

<rect
width="900"
height="900"
fill="#071224"/>

<circle
cx="450"
cy="430"
r="360"
fill="url(#bgGlow)"/>

<!-- GRID -->

<g
stroke="#1B305B"
stroke-width="1"
opacity=".35">

<path d="M0 100H900"/>
<path d="M0 200H900"/>
<path d="M0 300H900"/>
<path d="M0 400H900"/>
<path d="M0 500H900"/>
<path d="M0 600H900"/>
<path d="M0 700H900"/>
<path d="M0 800H900"/>

<path d="M100 0V900"/>
<path d="M200 0V900"/>
<path d="M300 0V900"/>
<path d="M400 0V900"/>
<path d="M500 0V900"/>
<path d="M600 0V900"/>
<path d="M700 0V900"/>
<path d="M800 0V900"/>

</g>

<!-- AMBIENT PARTICLES -->

<g opacity=".55">

<circle cx="120" cy="120" r="2" fill="#ffffff"/>

<circle cx="790" cy="170" r="2" fill="#F5C15D"/>

<circle cx="700" cy="770" r="2" fill="#ffffff"/>

<circle cx="210" cy="690" r="2" fill="#2563FF"/>

<circle cx="640" cy="320" r="1.8" fill="#ffffff"/>

<circle cx="330" cy="120" r="1.8" fill="#F5C15D"/>

</g>

<!-- BANGLADESH MAP -->

<path
id="bangladesh"

fill="url(#mapGradient)"

opacity=".93"

stroke="#8CC6FF"

stroke-width="2"

d="

M352 145

L324 170

L304 222

L289 280

L300 332

L280 380

L293 452

L268 522

L282 590

L320 642

L355 705

L390 760

L455 792

L508 772

L552 720

L583 662

L615 618

L625 560

L612 510

L596 470

L560 442

L545 392

L520 342

L530 286

L508 240

L478 206

L435 172

L392 150

Z

"

filter="url(#softGlow)"/>
<!-- ========================================= -->
<!-- NETWORK HUBS -->
<!-- ========================================= -->

<g id="cities">

<!-- Dhaka -->
<g transform="translate(452 430)">
<circle r="18"
