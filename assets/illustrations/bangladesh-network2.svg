<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#7FB2FF"/>
    </linearGradient>
    <linearGradient id="blueGradFaded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7FB2FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C15D"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="#071224"/>

  <g id="background-elements" opacity="0.4">
    <circle cx="150" cy="150" r="50" fill="url(#blueGradFaded)"/>
    <circle cx="750" cy="550" r="70" fill="url(#goldGrad)" fill-opacity="0.05"/>
    <rect x="50" y="500" width="20" height="100" rx="10" fill="#2563FF" opacity="0.1"/>
    <path d="M450 200 L500 250 L450 300 L400 250 Z" fill="#7FB2FF" opacity="0.1"/>
    <polyline points="100,600 150,550 200,600" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.2"/>
  </g>

  <g id="main-structure" filter="url(#shadow)">
    <g id="top-container" transform="translate(250, 100)">
      <rect width="400" height="180" rx="24" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect width="400" height="60" rx="24" fill="#FFFFFF" fill-opacity="0.04"/>
      <circle cx="360" cy="30" r="12" fill="url(#goldGrad)" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="35" font-family="SF Pro Display, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">PLATFORM CORE</text>
      <g id="metrics" transform="translate(30, 90)">
        <text x="0" y="0" font-family="SF Mono, Monospace" font-size="14" fill="#FFFFFF" opacity="0.7">Active Nodes</text>
        <text x="0" y="25" font-family="SF Mono, Monospace" font-size="24" font-weight="600" fill="#FFFFFF">1,284</text>
        <text x="120" y="0" font-family="SF Mono, Monospace" font-size="14" fill="#FFFFFF" opacity="0.7">Data Flow (MB/s)</text>
        <text x="120" y="25" font-family="SF Mono, Monospace" font-size="24" font-weight="600" fill="#FFFFFF">51.2</text>
      </g>
    </g>

    <g id="bottom-nodes" transform="translate(100, 400)">
      <g id="node-a" transform="translate(0, 0)">
        <rect width="220" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.06"/>
        <circle cx="30" cy="30" r="8" fill="url(#blueGrad)"/>
        <text x="50" y="35" font-family="SF Pro Display, Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">Data Ingest</text>
        <g transform="translate(20, 70)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5">
          <line x1="0" y1="40" x2="180" y2="40"/>
          <polyline points="0,50 10,40 20,50 30,40 40,50 50,40 60,50 70,40 80,50 90,40 100,50 110,40 120,50 130,40 140,50 150,40 160,50 170,40 180,50"/>
        </g>
      </g>
      <g id="node-b" transform="translate(280, 0)">
        <rect width="220" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.06"/>
        <circle cx="30" cy="30" r="8" fill="url(#goldGrad)"/>
        <text x="50" y="35" font-family="SF Pro Display, Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">Compute Unit</text>
        <circle cx="110" cy="95" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="5 5" opacity="0.4">
           <animateTransform attributeName="transform" type="rotate" from="0 110 95" to="360 110 95" dur="15s" repeatCount="indefinite"/>
        </circle>
        <rect x="100" y="85" width="20" height="20" rx="4" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <g id="node-c" transform="translate(560, 0)">
        <rect width="220" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.06"/>
        <circle cx="30" cy="30" r="8" fill="url(#blueGrad)"/>
        <text x="50" y="35" font-family="SF Pro Display, Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">Storage Sync</text>
        <g transform="translate(20, 70)">
          <rect x="0" y="0" width="180" height="50" rx="10" fill="#FFFFFF" fill-opacity="0.05"/>
          <rect x="20" y="15" width="140" height="5" rx="2" fill="url(#blueGrad)" opacity="0.8"/>
          <rect x="20" y="30" width="100" height="5" rx="2" fill="url(#blueGrad)" opacity="0.6"/>
        </g>
      </g>
    </g>
  </g>

  <g id="connections" fill="none" stroke-width="2" opacity="0.7">
    <path d="M210 480 L250 480 L450 300" stroke="url(#blueGrad)" stroke-dasharray="6 4"/>
    <path d="M490 400 L530 480 L550 480" stroke="url(#goldGrad)" stroke-dasharray="6 4"/>
    <path d="M640 400 L680 480 L770 480" stroke="url(#blueGrad)" stroke-dasharray="6 4"/>
    <g id="animated-dots">
      <circle r="4" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M210 480 L250 480 L450 300"/>
      </circle>
      <circle r="4" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M490 400 L530 480 L550 480"/>
      </circle>
       <circle r="4" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M640 400 L680 480 L770 480"/>
      </circle>
    </g>
  </g>

  <g id="foreground-elements">
     <g transform="translate(750, 550)">
        <circle r="45" fill="url(#goldGrad)" fill-opacity="0.08"/>
        <circle r="25" fill="url(#goldGrad)" fill-opacity="0.15"/>
        <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#FFFFFF" filter="url(#glow)">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
        </rect>
        <text x="-20" y="65" font-family="SF Mono, Monospace" font-size="12" fill="#FFFFFF" opacity="0.8">Secured Link</text>
     </g>
     <g transform="translate(80, 650)">
        <circle r="12" fill="url(#blueGrad)" opacity="0.5"/>
        <circle r="6" fill="#FFFFFF" filter="url(#glow)">
          <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
        </circle>
     </g>
  </g>

</svg>
