<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 900 900"
width="900"
height="900">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0A1730"/>
<stop offset="100%" stop-color="#081221"/>
</linearGradient>

<radialGradient id="blueGlow"
cx="50%"
cy="45%"
r="55%">

<stop offset="0%"
stop-color="#4F86FF"
stop-opacity=".28"/>

<stop offset="100%"
stop-color="#4F86FF"
stop-opacity="0"/>

</radialGradient>

<filter id="blur20">
<feGaussianBlur stdDeviation="20"/>
</filter>

<filter id="blur8">
<feGaussianBlur stdDeviation="8"/>
</filter>

<filter id="blur3">
<feGaussianBlur stdDeviation="3"/>
</filter>

</defs>

<rect
width="900"
height="900"
fill="url(#bg)"/>

<circle
cx="450"
cy="455"
r="300"
fill="url(#blueGlow)"
filter="url(#blur20)"/>

