<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 900 900"
fill="none">

<defs>

<linearGradient id="bgGlow" x1="0" y1="0" x2="900" y2="900">

<stop offset="0%" stop-color="#0F1F39"/>

<stop offset="100%" stop-color="#071221"/>

</linearGradient>

<linearGradient id="blueGradient"

x1="0"

y1="0"

x2="1"

y2="1">

<stop offset="0%"

stop-color="#66A9FF"/>

<stop offset="100%"

stop-color="#256DFF"/>

</linearGradient>

<linearGradient id="goldGradient"

x1="0"

y1="0"

x2="1"

y2="1">

<stop offset="0%"

stop-color="#FFE082"/>

<stop offset="100%"

stop-color="#FFD54F"/>

</linearGradient>

<filter id="softGlow"

x="-100%"

y="-100%"

width="300%"

height="300%">

<feGaussianBlur

stdDeviation="12"

result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<filter id="strongGlow"

x="-150%"

y="-150%"

width="400%"

height="400%">

<feGaussianBlur

stdDeviation="22"

result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

