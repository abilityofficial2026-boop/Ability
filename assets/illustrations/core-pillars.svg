<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 900 900"
width="900"
height="900">

<defs>

<radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
<stop offset="0%" stop-color="#2F66FF" stop-opacity=".18"/>
<stop offset="100%" stop-color="#2F66FF" stop-opacity="0"/>
</radialGradient>

<linearGradient id="blueRing"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#4F86FF"/>
<stop offset="100%" stop-color="#7FB8FF"/>

</linearGradient>

<linearGradient id="goldRing"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#FFD96A"/>
<stop offset="100%" stop-color="#F3BC35"/>

</linearGradient>

<filter id="blur12">
<feGaussianBlur stdDeviation="12"/>
</filter>

<filter id="blur5">
<feGaussianBlur stdDeviation="5"/>
</filter>

</defs>

<rect
width="900"
height="900"
fill="#081321"/>

<circle
cx="450"
cy="450"
r="300"
fill="url(#bgGlow)"
filter="url(#blur12)"/>

<!-- main orbital ring -->

<circle
cx="450"
cy="450"
r="235"
fill="none"
stroke="url(#blueRing)"
stroke-width="2"
opacity=".55"/>

<!-- inner orbital ring -->

<circle
cx="450"
cy="450"
r="185"
fill="none"
stroke="#4F86FF"
stroke-width="1.5"
opacity=".20"/>

<!-- center glow -->

<circle
cx="450"
cy="450"
r="70"
fill="#4F86FF"
opacity=".18"
filter="url(#blur12)"/>
