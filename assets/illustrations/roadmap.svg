<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1A36"/>
      <stop offset="50%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C15D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5C15D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7FB2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glassCircle" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="100" y1="600" x2="600" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="50%" stop-color="#7FB2FF"/>
      <stop offset="100%" stop-color="#F5C15D"/>
    </linearGradient>

    <filter id="ultraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="nodeIcon">
      <circle cx="0" cy="0" r="28" fill="url(#glassCircle)" stroke="url(#glassRim)" stroke-width="1.5" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="18" fill="#071126" stroke="#7FB2FF" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#F5C15D" filter="url(#softGlow)"/>
    </g>
  </defs>

  <g id="Background-Layer">
    <rect width="700" height="700" fill="url(#spaceBg)"/>
    <circle cx="200" cy="500" r="240" fill="url(#blueGlow)" filter="url(#ultraBlur)"/>
    <circle cx="500" cy="250" r="220" fill="url(#goldGlow)" filter="url(#ultraBlur)">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="350" r="250" fill="url(#blueGlow)" filter="url(#ultraBlur)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Subtle Grid -->
    <g stroke="#7FB2FF" stroke-width="0.5" stroke-opacity="0.08">
      <path d="M 0 100 L 700 100 M 0 200 L 700 200 M 0 300 L 700 300 M 0 400 L 700 400 M 0 500 L 700 500 M 0 600 L 700 600"/>
      <path d="M 100 0 L 100 700 M 200 0 L 200 700 M 300 0 L 300 700 M 400 0 L 400 700 M 500 0 L 500 700 M 600 0 L 600 700"/>
    </g>
  </g>

  <g id="Constellation-Layer" stroke="#7FB2FF" stroke-width="0.8" stroke-opacity="0.25" fill="none">
    <path d="M 100 580 L 180 480 L 250 510 L 320 380 L 420 420 L 500 280 L 600 150"/>
    <g fill="#7FB2FF" opacity="0.4">
      <circle cx="180" cy="480" r="2"/>
      <circle cx="250" cy="510" r="2"/>
      <circle cx="320" cy="380" r="2"/>
      <circle cx="420" cy="420" r="2"/>
      <circle cx="500" cy="280" r="2"/>
    </g>
  </g>

  <g id="Roadmap-Path-Layer">
    <!-- Main Glowing Path -->
    <path id="roadmapCurve" d="M 100 600 C 180 580, 200 420, 280 450 C 360 480, 340 300, 430 320 C 520 340, 500 180, 600 140" fill="none" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
    
    <!-- Animated Light Traveling Along Roadmap -->
    <path d="M 100 600 C 180 580, 200 420, 280 450 C 360 480, 340 300, 430 320 C 520 340, 500 180, 600 140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="30 250" stroke-linecap="round" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="280;0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="Milestones-Layer">
    <!-- Station 1: 2026 -->
    <g transform="translate(100, 600)">
      <use href="#nodeIcon"/>
      <text x="38" y="5" fill="#FFFFFF" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">2026</text>
      <text x="38" y="20" fill="#7FB2FF" font-family="system-ui" font-size="10">English Championship</text>
    </g>

    <!-- Station 2: 2027 -->
    <g transform="translate(200, 480)">
      <use href="#nodeIcon"/>
      <text x="38" y="5" fill="#FFFFFF" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">2027</text>
      <text x="38" y="20" fill="#7FB2FF" font-family="system-ui" font-size="10">Science Lab</text>
    </g>

    <!-- Station 3: 2028 -->
    <g transform="translate(300, 430)">
      <use href="#nodeIcon"/>
      <text x="38" y="5" fill="#FFFFFF" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">2028</text>
      <text x="38" y="20" fill="#7FB2FF" font-family="system-ui" font-size="10">Rural School Dev</text>
    </g>

    <!-- Station 4: 2029 -->
    <g transform="translate(370, 300)">
      <use href="#nodeIcon"/>
      <text x="38" y="5" fill="#FFFFFF" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">2029</text>
      <text x="38" y="20" fill="#7FB2FF" font-family="system-ui" font-size="10">Future Skills</text>
    </g>

    <!-- Station 5: 2030 -->
    <g transform="translate(500, 240)">
      <use href="#nodeIcon"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#pathGrad)" stroke-width="1.5" stroke-dasharray="4 4">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="5" fill="#FFFFFF" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">2030</text>
      <text x="38" y="20" fill="#7FB2FF" font-family="system-ui" font-size="10">National Network</text>
    </g>

    <!-- Station 6: Beyond -->
    <g transform="translate(600, 140)">
      <use href="#nodeIcon"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#F5C15D" stroke-width="1.5" filter="url(#softGlow)">
        <animate attributeName="r" values="32;38;32" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="5" fill="#F5C15D" font-family="system-ui" font-weight="700" font-size="12" letter-spacing="1">BEYOND</text>
      <text x="38" y="20" fill="#FFFFFF" font-family="system-ui" font-size="10">Global Vision</text>
    </g>
  </g>

  <g id="Floating-Particles" fill="#7FB2FF" opacity="0.7">
    <circle cx="150" cy="530" r="2.5">
      <animate attributeName="cy" values="530;515;530" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="380" r="3" fill="#F5C15D">
      <animate attributeName="cy" values="380;365;380" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="380" r="2">
      <animate attributeName="cy" values="380;365;380" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="190" r="3" fill="#F5C15D">
      <animate attributeName="cy" values="190;175;190" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
